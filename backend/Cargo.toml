[package]
name = "sniffer"
version = "1.0.0"
edition = "2021"
rust-version = "1.99.1"
publish = false

[[bin]]
name = "sniffer"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
dotenvy = "=0.15.7"
hex = "=0.4.3"
hmac = "=0.13.0"
pallas-addresses = "=1.4.0"
quick-xml = "=0.42.0"
redis = { version = "=1.8.1", features = ["tokio-comp"] }
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
roxmltree = "=0.21.2"
rust_decimal = { version = "=1.43.0", features = ["serde-with-str"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "chrono", "rust_decimal", "macros", "tls-rustls-aws-lc-rs"] }
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
ulid = "=3.0.0"
unicode-normalization = "=0.1.26"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["full"] }
wiremock = "=0.6.5"
