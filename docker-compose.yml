# Local dev stack for the Sniffer MVP (docs/plans/2026-10-30-sniffer-mvp.md, Task 4).
# Image tags are pinned exactly (docs/initial-check-spec.md §2).
# POSTGRES_PASSWORD comes from .env (never committed); see .env.example.
# Ports bind to 127.0.0.1 only.

services:
  postgres:
    image: postgres:16.15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sniffer}
      POSTGRES_DB: ${POSTGRES_DB:-sniffer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports:
      # Host port is configurable: the host may already run its own Postgres on 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.12
    restart: unless-stopped
    ports:
      # Host port 6380: a local redis-server already listens on 6379 on the dev machine.
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Task 18 (backend/Dockerfile). Reads the rest of its config (SNIFFER_API_TOKEN,
  # SNIFFER_HMAC_KEY, BLOCKFROST_*, ...) from .env; DATABASE_URL and REDIS_URL are
  # overridden to the compose service names because .env points at 127.0.0.1 for host
  # use. POSTGRES_PASSWORD must be URL-safe (openssl rand -hex 24).
  sniffer:
    build: ./backend
    image: sniffer:dev
    restart: unless-stopped
    env_file:
      - .env
      # T28 live settings and generated secrets (git-ignored); optional so a plain
      # `docker compose up` still works without them.
      - path: .local/live.env
        required: false
      - path: .local/sniffer-secrets.env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sniffer}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:-sniffer}
      REDIS_URL: redis://redis:6379/0
      SNIFFER_BIND_ADDR: 0.0.0.0:8080
      # Same Preprod key the Node side reads as BLOCKFROST_API_KEY_PREPROD.
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID:-${BLOCKFROST_API_KEY_PREPROD:?set in .env}}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
